<!doctype html>
<html lang="{{ DEFAULT_LANG }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A timeline of real vulnerabilities with Shell names."
    />
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/site.css"
    />
    <style>
      .timeline-entry + .timeline-submission {
        margin-top: 1rem;
      }

      .timeline-submission {
        display: block;
        padding-top: 4rem;
      }

      .timeline-submission::before {
        position: absolute;
        top: 0.6rem;
        bottom: -6rem;
        left: 50%;
        width: 0.3rem;
        background: var(--background);
        content: "";
        transform: translateX(-50%);
      }

      .timeline-submission .timeline-marker {
        top: 1.5rem;
        width: 0.5rem;
        height: 1.8rem;
        border: 0;
        border-radius: 0;
        background:
          radial-gradient(circle at center 0.3rem, var(--line) 0.16rem, transparent 0.18rem),
          radial-gradient(circle at center 0.9rem, var(--line) 0.16rem, transparent 0.18rem),
          radial-gradient(circle at center 1.5rem, var(--line) 0.16rem, transparent 0.18rem);
      }

      .timeline-submission .timeline-card {
        width: min(100%, 28rem);
        margin-inline: auto;
        text-align: center;
      }

      @media (max-width: 44rem) {
        .timeline-submission {
          padding-top: 3rem;
        }

        .timeline-submission::before {
          left: -2rem;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <h1>{{ SITENAME }}</h1>
        <p class="site-intro">
          I think that RCE disclosures have a trope problem
        </p>
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <p>Mocking these names doesn't mean the bugs aren't real.</p>
      <p>
        Thanks to Molly White for inspiring the layout. You should read
        <a href="https://www.web3isgoinggreat.com/">web3 is going just great</a
        >.
      </p>
    </footer>
  </body>
</html>
