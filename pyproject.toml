[project]
name = "2shell2furio-us"
version = "0.1.0"
description = "A timeline of real vulnerabilities with Shell names"
authors = [
    { name = "Chris Rose", email = "offline@offby1.net" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "invoke>=2.2",
    "livereload>=2.7",
    "pelican[markdown]>=4.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
exclude = [".superpowers", "output"]
